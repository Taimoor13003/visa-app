# Demo monitors. One entry = one route (country + application city + category).
#
# steps: what the script does after login to reach the "earliest slot" message.
#   - click: "button or link text"
#   - select: {index: 0, option: "visible option text"}   # index = Nth dropdown on page
#   - select: {label: "Field label", option: "..."}       # or find the dropdown by its label
#   - wait: 3                                              # seconds
#   - goto: "https://..."
# Exact button/option texts must be copied from the live portal. Run
#   python monitor.py --inspect "<name>"
# after logging in to see the page text and fix these.
#
# extract (optional): CSS selectors to read open calendar dates / time slots
# when the portal shows a calendar instead of an "earliest slot" sentence.

monitors:
  - name: "VFS – Pakistan → Netherlands – Islamabad"
    provider: vfs
    profile: vfs                       # browser profile folder (keeps the login session)
    credentials: VFS                   # reads VFS_EMAIL / VFS_PASSWORD from .env
    category: "Short stay (Schengen) – Tourism"
    login_url: "https://visa.vfsglobal.com/pak/en/nld/login"
    start_url: "https://visa.vfsglobal.com/pak/en/nld/dashboard"     # only works once logged in
    booking_url: "https://visa.vfsglobal.com/pak/en/nld/login"
    # In-page route (see VFS_PLAN.md): a person logs in in their own Chrome, the script attaches
    # (BROWSER_CDP_URL in .env), never reloads, and re-picks the centre to get a fresh result.
    # Values are option codes (exact) or option texts. Pakistan codes are not known yet, so texts
    # are used here; if one is wrong the check stops and lists the real options. Seen live on
    # 2026-11-19: centre "Netherlands Karachi", category "Schengen Visa", sub-categories
    # "Family And Friends Visit" and Tourism.
    interval_minutes: 20
    inpage:
      centre: "Islamabad"
      category: "Schengen Visa"
      subcategory: "Tourism"

  - name: "VFS – Indonesia → Netherlands – Jakarta"
    provider: vfs
    profile: vfs_idn
    credentials: VFS_IDN               # unused: a person always logs in on in-page routes
    category: "Schengen Short Stay"
    login_url: "https://visa.vfsglobal.com/idn/en/nld/login"
    start_url: "https://visa.vfsglobal.com/idn/en/nld/dashboard"
    booking_url: "https://visa.vfsglobal.com/idn/en/nld/login"
    interval_minutes: 20
    inpage:                            # codes read from the live page on 2026-11-19
      centre: "CGK"                    # Netherlands Jakarta (Surabaya = SUB, Bali = BZI)
      category: "07052024"             # Schengen
      subcategory: "07052024sss"       # Schengen Short Stay

  - name: "BLS – Pakistan → Spain – Islamabad"
    provider: bls
    profile: bls
    credentials: BLS                   # reads BLS_EMAIL / BLS_PASSWORD from .env
    category: "Tourist"
    login_url: "https://appointment.thespainvisa.com/Global/account/login"
    start_url: "https://appointment.thespainvisa.com/Global/appointment/newappointment"
    booking_url: "https://appointment.thespainvisa.com/Global/account/login"
    interval_minutes: 15
    steps:
      - select: {index: 0, option: "Islamabad"}
      - select: {index: 1, option: "Schengen"}
      - select: {index: 2, option: "Tourist"}
      - click: "Submit"
      - wait: 4
    extract:
      dates: null      # e.g. "td.day:not(.disabled)" once you see the calendar HTML
      times: null      # e.g. "#AppointmentSlot option"
